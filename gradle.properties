org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build with JDK 17 to 21. The JBR bundled with newer Android Studio versions can be JDK 25, which this
# Gradle version's embedded Kotlin compiler can't parse (IllegalArgumentException: 25.0.x). If that
# happens, point Gradle at a JDK 21 in your own ~/.gradle/gradle.properties:
#   org.gradle.java.home=/path/to/jdk-21
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
